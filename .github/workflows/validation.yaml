name: Documentation validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  docs-and-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "devel"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::roxygen2@8.1.0, any::rmarkdown
          dependencies: '"hard"'

      - name: Check roxygen output and README freshness
        run: |
          Rscript scripts/check-docs.R
          Rscript scripts/check-readme.R

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "devel"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgsl-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::yaml
          dependencies: '"hard"'

      - name: Check reference coverage and build without examples
        run: Rscript scripts/check-reference.R
