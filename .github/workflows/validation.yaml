name: Bioconductor validation

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Bioconductor devel (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: v0.78.0
          environments: container
          locked: true

      - uses: docker/setup-buildx-action@v3

      - name: Identify validation image inputs
        id: image
        run: echo "inputs=$(bash scripts/run-bioc-devel.sh fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Build Bioconductor validation image
        uses: docker/build-push-action@v6
        with:
          context: "."
          file: docker/bioc-devel.Dockerfile
          pull: true
          load: true
          tags: mutseqr-bioc-devel:local
          labels: org.mutseqr.validation-inputs=${{ steps.image.outputs.inputs }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the shared local and CI validation gate
        run: pixi run --locked -e container validate

      - name: Upload package check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bioconductor-validation-results
          path: .validation/
          if-no-files-found: ignore
