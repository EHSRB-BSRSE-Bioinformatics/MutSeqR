on:
  push:
    paths:
      - README.Rmd
  workflow_dispatch: # allows manual runs

name: Knit README

jobs:
  knit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install knitr
        run: Rscript -e 'install.packages("rmarkdown", repos = "https://cloud.r-project.org")'

      - name: Render README
        run: Rscript -e 'rmarkdown::render("README.Rmd", output_format = "github_document", output_file = "README.md", clean = TRUE)'

      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git commit README.md -m 'Re-knit README.Rmd' || echo "No changes to commit"
          git push origin || echo "No changes to commit"
