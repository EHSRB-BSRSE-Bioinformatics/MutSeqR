# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch vignette YAML for pkgdown rendering
        run: |
          awk '
            BEGIN { in_output = 0 }
            /^output:/ {
              print "output:\n  rmarkdown::html_document:\n    toc: true\n    toc_float: yes\n    code_folding: show\n    code_download: yes\n    css: custom.css"
              in_output = 1
              next
            }
            in_output && /^\S/ { in_output = 0 }
            !in_output { print }
          ' vignettes/MutSeqR_introduction.Rmd > tmp && mv tmp vignettes/MutSeqR_introduction.Rmd

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgsl-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          dependencies: '"hard"'
          needs: website
      
      - name: Create articles directory
        run: mkdir -p docs/articles

      -name: Render Analyzing Mutation Spectra
        run: |
          Rscript -e '
            rmarkdown::render(
              "inst/extdata/Analyzing Mutation Spectra.Rmd",
              output_file = "analyzing-mutation-spectra.html", # Output filename matching pkgdown convention
              output_dir = "docs/articles" # Place directly in the expected articles directory
            )
          '
        shell: Rscript {0}

      - name: Render Modelling Mutation Frequencies
        run: |
          Rscript -e '
            rmarkdown::render(
              "inst/extdata/Modelling Mutation Frequencies.Rmd",
              output_file = "modelling-mutation-frequencies.html", # Output filename matching pkgdown convention
              output_dir = "docs/articles" # Place directly in the expected articles directory
            )
          '
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
