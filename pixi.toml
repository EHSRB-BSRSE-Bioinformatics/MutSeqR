# MutSeqR development environment
#
# pixi manages the R runtime + tooling (pandoc, git, ...). R *package*
# dependencies are installed from CRAN/Bioconductor into this environment
# via `pixi run setup` (see scripts/setup-deps.R) — conda-forge's
# Bioconductor coverage is not complete, so we don't rely on it.
#
# Quick start:
#   pixi install
#   pixi run setup
#   pixi run test
#
# Note: tasks that use bash (prepare-release) require WSL/Git-Bash on
# Windows.

[workspace]
name = "mutseqr"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
# R version matching the current Bioconductor release (3.23 -> R 4.5)
r-base = "4.5.*"
pandoc = ">=3.6"
git = "*"
[tasks]
# one-time (or after adding new deps): installs dev tools + all package
# deps from DESCRIPTION (CRAN + Bioconductor)
setup = "Rscript scripts/setup-deps.R"

# everyday development
test = "Rscript scripts/run-tests.R"
document = "Rscript -e 'devtools::document()'"
check-docs = "Rscript scripts/check-docs.R"
check-readme = "Rscript scripts/check-readme.R"
check-reference = "Rscript scripts/check-reference.R"
check = "Rscript scripts/run-check.R"
bioccheck = "Rscript -e 'BiocCheck::BiocCheck(\".\", `quit-with-status` = TRUE)'"
pkgdown = "Rscript -e 'pkgdown::build_site()'"
validate = { depends-on = ["check-docs", "check-readme", "check-reference", "test", "check", "bioccheck"] }

# release workflow: documentation -> tests/checks -> NEWS check -> z-bump -> commit
# (requires bash; on Windows use WSL or Git-Bash)
prepare-release = "bash scripts/prepare-release.sh"
