# MutSeqR development environment
#
# pixi manages the R runtime, CRAN packages, Bioconductor packages, and
# development tools. Bioconductor packages come from Bioconda, which does
# not publish Windows builds; Windows can use `pixi run setup` instead.
#
# Quick start:
#   pixi install
#   pixi run test
#
# Note: tasks that use bash (prepare-release) require WSL/Git-Bash on
# Windows.

[workspace]
name = "mutseqr"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
# R version matching the current Bioconductor release (3.23 -> R 4.5)
r-base = "4.5.*"
pandoc = ">=3.6"
git = "*"
r-devtools = ">=2.5.0,<3"
r-roxygen2 = ">=8.1.0,<9"
r-testthat = ">=3.0.0,<4"
r-rcmdcheck = ">=1.4.0,<2"
r-pkgdown = ">=2.2.0,<3"
"r-data.table" = "*"
"r-dplyr" = "*"
"r-ggplot2" = "*"
"r-here" = "*"
"r-ggdendro" = "*"
"r-magrittr" = "*"
"r-rlang" = "*"
"r-stringr" = "*"
"r-tibble" = "*"
"r-tidyr" = "*"

# Bioconda publishes these builds for Linux and macOS. Windows users can
# install them from Bioconductor with the setup task below.
[target.linux-64.dependencies]
bioconductor-biocgenerics = "*"
bioconductor-biostrings = "*"
bioconductor-bsgenome = "*"
bioconductor-genomicranges = "*"
bioconductor-iranges = "*"
bioconductor-plyranges = "*"
bioconductor-s4vectors = "*"
bioconductor-seqinfo = "*"
bioconductor-summarizedexperiment = "*"
bioconductor-variantannotation = "*"

[target.osx-64.dependencies]
bioconductor-biocgenerics = "*"
bioconductor-biostrings = "*"
bioconductor-bsgenome = "*"
bioconductor-genomicranges = "*"
bioconductor-iranges = "*"
bioconductor-plyranges = "*"
bioconductor-s4vectors = "*"
bioconductor-seqinfo = "*"
bioconductor-summarizedexperiment = "*"
bioconductor-variantannotation = "*"

[target.osx-arm64.dependencies]
bioconductor-biocgenerics = "*"
bioconductor-biostrings = "*"
bioconductor-bsgenome = "*"
bioconductor-genomicranges = "*"
bioconductor-iranges = "*"
bioconductor-plyranges = "*"
bioconductor-s4vectors = "*"
bioconductor-seqinfo = "*"
bioconductor-summarizedexperiment = "*"
bioconductor-variantannotation = "*"

[tasks]
# Installs Suggests and any Bioconductor imports missing on Windows.
setup = "Rscript scripts/setup-deps.R"

# everyday development
test = "Rscript scripts/run-tests.R"
document = "Rscript -e 'devtools::document()'"
check-docs = "Rscript scripts/check-docs.R"
check-readme = "Rscript scripts/check-readme.R"
check-reference = "Rscript scripts/check-reference.R"
check = "Rscript scripts/run-check.R"
bioccheck = "Rscript -e 'BiocCheck::BiocCheck(\".\", `quit-with-status` = TRUE)'"
pkgdown = "Rscript -e 'pkgdown::build_site()'"
validate = { depends-on = ["check-docs", "check-readme", "check-reference", "test", "check", "bioccheck"] }

# release workflow: documentation -> tests/checks -> NEWS check -> z-bump -> commit
# (requires bash; on Windows use WSL or Git-Bash)
prepare-release = "bash scripts/prepare-release.sh"
